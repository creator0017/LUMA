    <script>
      // Ensure window.fetch has both getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var nativeFetch = window.fetch;
          var activeFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e1) {
          try {
            var proto = Object.getPrototypeOf(window) || (typeof Window !== 'undefined' ? Window.prototype : null);
            if (proto) {
              var protoFetch = proto.fetch || window.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return protoFetch;
                },
                set: function(fn) {
                  protoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
